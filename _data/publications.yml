# --- Projetos de Pesquisa e Desenvolvimento ----------------------------------
projects:
  - title: "SMARTLAB — Uma proposta de modernização para ambientes de pesquisa acadêmicos"
    title_en: "SMARTLAB — A modernization proposal for academic research environments"
    role_pt: "Coordenador"
    role_en: "Principal Investigator"
    institution: "UFERSA"
    period: "2026 – Atual"
    status_pt: "Em andamento"
    status_en: "Ongoing"
    description_pt: "Implementação de infraestrutura de Internet das Coisas (IoT) para modernização de laboratórios de pesquisa acadêmica. O projeto integra hardware para controle de acesso via RFID, monitoramento ambiental e segurança perimetral, além de uma plataforma de software centralizada. Visa otimizar a gestão de recursos, reduzir custos operacionais com energia e fornecer dados para análises sobre o comportamento de uso do espaço."
    description_en: "Implementation of an Internet of Things (IoT) infrastructure for modernizing academic research laboratories. The project integrates hardware for RFID access control, environmental monitoring, and perimeter security, along with a centralized software platform. It aims to optimize resource management, reduce energy operational costs, and provide data for space usage behavior analysis."
    tags: ["IoT", "RFID", "Automação", "Monitoramento", "UFERSA"]
    highlight: true

  - title: "Análise preditiva do desempenho no ENEM: explorando fatores regionais, sociais e de gênero com técnicas de ciência de dados"
    title_en: "Predictive analysis of ENEM performance: exploring regional, social and gender factors with data science techniques"
    role_pt: "Integrante / Orientador de IC"
    role_en: "Member / Undergraduate Research Supervisor"
    institution: "UFERSA"
    period: "2025 – Atual"
    status_pt: "Em andamento"
    status_en: "Ongoing"
    description_pt: "Projeto que explora os microdados do ENEM disponibilizados pelo INEP para identificar correlações entre desempenho acadêmico e variáveis socioeconômicas, regionais e de gênero. Aplica técnicas de aprendizado supervisionado e não supervisionado (regressão logística, árvores de decisão, clustering) para construção de modelos preditivos e análise do impacto de políticas públicas educacionais."
    description_en: "Project exploring ENEM microdata provided by INEP to identify correlations between academic performance and socioeconomic, regional, and gender variables. Applies supervised and unsupervised learning techniques (logistic regression, decision trees, clustering) to build predictive models and analyze the impact of educational public policies."
    tags: ["ENEM", "Machine Learning", "Data Science", "Python", "Educação", "Iniciação Científica"]
    highlight: true

  - title: "Estudo e aplicação de técnicas de Ciência de Dados e ML para identificação de áreas prioritárias para vigilância e controle de arboviroses em Mossoró-RN (Parte 2)"
    title_en: "Study and application of Data Science and ML techniques for identifying priority areas for arbovirus surveillance and control in Mossoró-RN (Part 2)"
    role_pt: "Aluno de Iniciação Científica"
    role_en: "Undergraduate Research Student"
    advisor_pt: "Orientadora: Profª. Angélica Félix de Castro"
    advisor_en: "Advisor: Prof. Angélica Félix de Castro"
    institution: "UFERSA"
    period: "2022 – 2023"
    status_pt: "Concluído"
    status_en: "Completed"
    description_pt: "Continuação do projeto de mapeamento epidemiológico de arboviroses em Mossoró (RN), ampliando a base de dados e os modelos preditivos para vigilância em saúde pública. Desenvolvido como Iniciação Científica sob orientação da Profª. Angélica Félix de Castro."
    description_en: "Continuation of the epidemiological mapping project for arboviruses in Mossoró (RN), expanding the database and predictive models for public health surveillance. Developed as undergraduate research under the supervision of Prof. Angélica Félix de Castro."
    tags: ["Arboviroses", "Machine Learning", "Epidemiologia", "Mossoró", "Iniciação Científica"]
    highlight: false

